[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actiongate"
version = "0.3.2"
description = "Evidence release gates and scoped action controls for tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
classifiers = ["License :: Other/Proprietary License"]
authors = [{name = "Marco Armijo (R-Mijo)"}]
dependencies = []

[project.scripts]
actiongate = "actiongate.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt"]

[tool.setuptools.packages.find]
include = ["actiongate*"]

[tool.setuptools.package-data]
actiongate = ["data/*.jsonl", "data/*.txt"]
